# cava config for the gery/spotify bar visualizer.
#
# Captures ONLY Spotify's PipeWire playback node (not the whole sink mix) and
# emits one raw ASCII frame per line on stdout, which cava-runner.sh forwards to
# the plugin service. Kept deliberately small/frugal: 24 bars at 20 fps is
# enough for a ~56px bar capsule.
#
# `source` is passed to PipeWire as `target.object`, so it can name an
# application playback node (Stream/Output/Audio) — the same mechanism OBS's
# per-app capture uses. Spotify's node.name is "spotify" (stable while it runs);
# change this line if you ever want to visualize a different app instead. If the
# node is absent cava just reads silence, so no crash loop.
#
# Verified against cava 1.0.0 (keys below are the ones it actually reads).

[general]
bars = 24
framerate = 20
sensitivity = 100

[input]
method = pipewire
source = spotify

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
