id         = "gery/seaweedfs"
name       = "SeaweedFS Status"
version    = "0.1.0"
plugin_api = 3
author     = "gery"
icon       = "server"

[[setting]]
key        = "masterPort"
type       = "int"
label_key  = "settings.masterPort.label"
default    = 9333

[[setting]]
key        = "volumePort"
type       = "int"
label_key  = "settings.volumePort.label"
default    = 8080

[[setting]]
key        = "filerPort"
type       = "int"
label_key  = "settings.filerPort.label"
default    = 8888

[[widget]]
id    = "seaweedfs"
entry = "seaweedfs.luau"