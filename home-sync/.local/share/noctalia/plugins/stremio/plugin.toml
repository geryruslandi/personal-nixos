id         = "gery/stremio"
name       = "Stremio Server"
version    = "0.2.0"
plugin_api = 3
author     = "gery"
icon       = "movie"

# The plugin declares and owns the stremio service: these settings are the
# unit definition. Nix only provides the `stremio-service` binary dependency.
[[setting]]
key        = "port"
type       = "int"
label_key  = "settings.port.label"
default    = 11470

[[setting]]
key        = "binary"
type       = "string"
label_key  = "settings.binary.label"
default    = "stremio-service"

[[setting]]
key        = "auto_start"
type       = "bool"
label_key  = "settings.auto_start.label"
default    = false

[[widget]]
id    = "stremio"
entry = "stremio.luau"
