id         = "gery/sony-headset"
name       = "Sony Headset"
version    = "1.0.0"
plugin_api = 24
author     = "gery"
icon       = "headphones"
license    = "MIT"

description = "Battery, noise cancelling and full control for Sony MDR-v2 headphones (WH-1000XM5/XM6, WF-series, LinkBuds, WH-CH720N, ...) over Bluetooth. Auto-discovers the paired device."

# The helper owns the Bluetooth control channel; these settings are passed on
# its command line. Empty address/channel = auto-discover the device and its
# RFCOMM channel.
[[setting]]
key        = "binary"
type       = "string"
label_key  = "settings.binary.label"
description_key = "settings.binary.description"
default    = "sonyctl"

[[setting]]
key        = "address"
type       = "string"
label_key  = "settings.address.label"
description_key = "settings.address.description"
default    = ""

[[setting]]
key        = "name_filter"
type       = "string"
label_key  = "settings.name_filter.label"
description_key = "settings.name_filter.description"
default    = ""

[[setting]]
key        = "channel"
type       = "string"
label_key  = "settings.channel.label"
description_key = "settings.channel.description"
default    = ""

[[setting]]
key        = "state_dir"
type       = "string"
label_key  = "settings.state_dir.label"
description_key = "settings.state_dir.description"
default    = "~/.local/state/noctalia-sony-headset"

[[setting]]
key        = "bluetoothctl_binary"
type       = "string"
label_key  = "settings.bluetoothctl_binary.label"
description_key = "settings.bluetoothctl_binary.description"
default    = "bluetoothctl"

[[setting]]
key        = "sdptool_binary"
type       = "string"
label_key  = "settings.sdptool_binary.label"
description_key = "settings.sdptool_binary.description"
default    = "sdptool"

[[setting]]
key        = "keep_alive"
type       = "bool"
label_key  = "settings.keep_alive.label"
description_key = "settings.keep_alive.description"
default    = true

[[setting]]
key        = "idle_timeout"
type       = "string"
label_key  = "settings.idle_timeout.label"
description_key = "settings.idle_timeout.description"
default    = "90"

[[setting]]
key        = "refresh_seconds"
type       = "int"
label_key  = "settings.refresh_seconds.label"
description_key = "settings.refresh_seconds.description"
default    = 15
min        = 2
max        = 60

[[service]]
id    = "poll"
entry = "service.luau"

[[widget]]
id    = "headset"
entry = "widget.luau"

[[panel]]
id              = "headset-panel"
entry           = "panel.luau"
width           = 380
height          = 620
placement       = "floating"
open_near_click = true
