id         = "gery/xm5"
name       = "Sony XM5"
version    = "1.0.0"
plugin_api = 24
author     = "gery"
icon       = "headphones"
license    = "MIT"

description = "Battery, noise cancelling and full control for Sony WH-1000XM5 headphones over Bluetooth (MDR v2)."

# The helper owns the Bluetooth control channel; these settings are passed on
# its command line. Defaults target this machine's WH-1000XM5.
[[setting]]
key        = "binary"
type       = "string"
label_key  = "settings.binary.label"
description_key = "settings.binary.description"
default    = "xm5ctl"

[[setting]]
key        = "address"
type       = "string"
label_key  = "settings.address.label"
description_key = "settings.address.description"
default    = "AC:80:0A:87:CD:36"

[[setting]]
key        = "channel"
type       = "string"
label_key  = "settings.channel.label"
description_key = "settings.channel.description"
default    = "9"

[[setting]]
key        = "state_dir"
type       = "string"
label_key  = "settings.state_dir.label"
description_key = "settings.state_dir.description"
default    = "~/.local/state/noctalia-xm5"

[[setting]]
key        = "keep_alive"
type       = "bool"
label_key  = "settings.keep_alive.label"
description_key = "settings.keep_alive.description"
default    = true

[[setting]]
key        = "idle_timeout"
type       = "string"
label_key  = "settings.idle_timeout.label"
description_key = "settings.idle_timeout.description"
default    = "90"

[[setting]]
key        = "refresh_seconds"
type       = "int"
label_key  = "settings.refresh_seconds.label"
description_key = "settings.refresh_seconds.description"
default    = 15
min        = 2
max        = 60

[[service]]
id    = "poll"
entry = "service.luau"

[[widget]]
id    = "xm5"
entry = "widget.luau"

[[panel]]
id              = "xm5-panel"
entry           = "panel.luau"
width           = 380
height          = 620
placement       = "floating"
open_near_click = true
