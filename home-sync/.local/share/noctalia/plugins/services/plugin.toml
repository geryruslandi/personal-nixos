id         = "gery/services"
name       = "Services Hub"
version    = "1.0.1"
plugin_api = 22
author     = "gery"
icon       = "server"
license    = "MIT"

description = "Consolidated hub for all gery services: polling, bar count widget and a toggle panel."

# NOTE: no port settings for redis/mysql/postgresql/seaweedfs/stremio — those
# are display-only there (real listeners come from secrets.nix via Nix modules
# or the daemon's own config). Only ports the plugin actually passes on the
# start command line (mailpit, seanime) are configurable.

[[setting]]
key        = "mailpit_binary"
type       = "string"
label_key  = "settings.binary.label"
default    = "mailpit"

[[setting]]
key        = "mailpit_smtpPort"
type       = "string"
label_key  = "settings.mailpit_smtpPort.label"
default    = "1025"

[[setting]]
key        = "mailpit_uiPort"
type       = "string"
label_key  = "settings.mailpit_uiPort.label"
default    = "8025"

[[setting]]
key        = "mailpit_auto_start"
type       = "bool"
label_key  = "settings.auto_start.label"
default    = false

[[setting]]
key        = "seanime_binary"
type       = "string"
label_key  = "settings.binary.label"
default    = "seanime"

[[setting]]
key        = "seanime_datadir"
type       = "string"
label_key  = "settings.datadir.label"
default    = "$HOME/.local/share/seanime"

[[setting]]
key        = "seanime_port"
type       = "string"
label_key  = "settings.seanime_port.label"
default    = "43211"

[[setting]]
key        = "seanime_auto_start"
type       = "bool"
label_key  = "settings.auto_start.label"
default    = false

[[setting]]
key        = "stremio_binary"
type       = "string"
label_key  = "settings.binary.label"
default    = "stremio-service"

[[setting]]
key        = "stremio_auto_start"
type       = "bool"
label_key  = "settings.auto_start.label"
default    = false

[[service]]
id    = "poll"
entry = "service.luau"

[[widget]]
id    = "services"
entry = "widget.luau"

[[panel]]
id             = "services-panel"
entry          = "panel.luau"
width          = 700
height         = 525
placement      = "floating"
open_near_click = true
